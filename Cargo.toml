[package]
name = "bevy_flash_remake"
version = "0.1.0"
edition = "2024"

[dependencies]
vatf = { path = "../animx" }
bevy = { path = "../bevy", default-features = false, features = [
    "bevy_asset",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_mesh",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_shader",
    "bevy_log",
] }
anyhow = "1"
bytemuck = { version = "1.21.0", features = ["derive"] }
image = "0.25.10"


[dev-dependencies]
# `ui_bevy_render` is the smallest feature set that both exposes `bevy_ui`'s
# `Text`/`Node` and actually renders them; `2d` alone only reaches `common_api`.
bevy = { path = "../bevy", default-features = false, features = [
    "2d",
    "ui_bevy_render",
    "bevy_dev_tools",
] }
