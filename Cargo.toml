[package]
name = "bevy_flash"
version = "0.1.0"
edition = "2024"

[features]
default = ["ui"]
ui = ["bevy/bevy_ui", "bevy/bevy_ui_render"]
asset_processor = ["bevy/asset_processor"]

[dependencies]
vatf = { git = "https://github.com/aojiaoxiaolinlin/vatf.git" }
bevy = { version = "0.19", default-features = false, features = [
    "bevy_asset",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_mesh",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_shader",
    "bevy_log",
] }
anyhow = "1"
bytemuck = { version = "1.21.0", features = ["derive"] }
image = "0.25.10"


[dev-dependencies]
# `ui_bevy_render` is the smallest feature set that both exposes `bevy_ui`'s
# `Text`/`Node` and actually renders them; `2d` alone only reaches `common_api`.
bevy = { version = "0.19", default-features = false, features = [
    "2d",
    "ui_bevy_render",
    "bevy_dev_tools",
] }

[[example]]
name = "ui_graphics"
required-features = ["ui"]

[[example]]
name = "animated_ui"
required-features = ["ui"]

[[example]]
name = "ui_buttons"
required-features = ["ui"]

[[example]]
name = "processed_ui"
required-features = ["ui", "asset_processor"]
