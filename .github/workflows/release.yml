name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read package version and validate tag
        id: package
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          if os.environ["REF_TYPE"] == "tag" and os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Release tag must be v{version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  package:
    name: Build crate package
    needs: [version, checks]
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install latest stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Package and verify
        run: cargo package --locked
      - uses: actions/upload-artifact@v4
        with:
          name: bevy_flash-package
          path: target/package/bevy_flash-${{ needs.version.outputs.version }}.crate
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: bevy_flash-package
          path: dist
      - name: Create checksums
        working-directory: dist
        run: sha256sum *.crate > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* "${args[@]}"
